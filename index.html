<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码自动播放系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .upload-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        .upload-card {
            background: #252525;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
        }

        .upload-card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #4a90e2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .paste-area {
            width: 100%;
            min-height: 160px;
            background: #1e1e1e;
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 16px;
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .paste-area:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .paste-area::placeholder {
            color: #666;
        }

        .paste-actions {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            justify-content: flex-end;
        }

        .upload-area {
            border: 3px dashed #4a90e2;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(74, 144, 226, 0.08);
            margin-top: 10px;
        }

        .upload-area:hover {
            background: rgba(74, 144, 226, 0.15);
            transform: translateY(-2px);
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            font-size: 20px;
            font-weight: bold;
            color: #4a90e2;
            cursor: pointer;
        }

        .hint {
            margin-top: 8px;
            color: #888;
            font-size: 13px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #666;
            font-size: 13px;
            margin: 10px 0;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #333;
        }

        .player-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
            position: relative;
        }

        .qr-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            position: relative;
            overflow: hidden;
            padding: 40px;
        }

        #qrWrapper {
            padding: 30px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: 8px solid #4a90e2;
            transition: border-color 0.4s ease;
            text-align: center;
            max-width: 90vw;
        }

        #qrcode img {
            display: block;
            width: 400px !important;
            height: 400px !important;
            image-rendering: pixelated;
            margin-bottom: 20px;
        }

        .data-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 15px;
            color: #555;
            flex-wrap: wrap;
        }

        .data-item {
            background: #f5f5f5;
            padding: 10px 18px;
            border-radius: 8px;
            border-left: 4px solid #4a90e2;
            min-width: 100px;
        }

        .data-label {
            font-weight: bold;
            color: #333;
            margin-right: 8px;
        }

        .url-display {
            font-family: monospace;
            font-size: 13px;
            color: #666;
            word-break: break-all;
            max-width: 420px;
            margin-top: 10px;
            padding: 10px;
            background: #fafafa;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .info-bar {
            background: #2a2a2a;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #444;
            flex-wrap: wrap;
            gap: 15px;
        }

        .progress-info {
            font-size: 24px;
            font-weight: bold;
            color: #4a90e2;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: #357abd;
            transform: translateY(-1px);
        }

        button.secondary {
            background: #555;
        }

        button.secondary:hover {
            background: #666;
        }

        button.danger {
            background: #c0392b;
        }

        button.danger:hover {
            background: #a93226;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            margin-right: 6px;
        }

        .status-indicator.paused {
            background: #ff9800;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #888;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100px;
        }

        .keyboard-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            color: #aaa;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 10;
        }

        .player-screen:hover .keyboard-hint {
            opacity: 1;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .config-note {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            line-height: 1.5;
        }

        .config-note code {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            color: #4a90e2;
            font-family: monospace;
        }
    </style>
<base target="_blank">
</head>
<body>

    <!-- 上传/粘贴界面 -->
    <div class="upload-screen" id="uploadScreen">
        <h1 style="font-size: 30px; margin-bottom: 6px;">📱 二维码自动播放</h1>
        <p style="color: #888; margin-bottom: 24px;">粘贴数据或上传Excel，自动提取生成二维码</p>

        <div class="upload-card">
            <h2>📋 直接粘贴数据</h2>
            <textarea 
                class="paste-area" 
                id="pasteInput" 
                placeholder="在此处粘贴从Excel或其他地方复制的数据...&#10;支持 Tab 分隔或逗号分隔的多列表格数据&#10;每行一条记录"></textarea>
            <div class="config-note">
                当前配置：仅第 <code>18</code> 列（R列）值为 <code>"设备接入"</code> 时才生成二维码。<br>
                二维码取自第 <code>19</code> 列（S列），下方显示第 <code>3</code> 列（C列）、第 <code>5</code> 列（E列）、第 <code>11</code> 列（K列）
            </div>
            <div class="paste-actions">
                <button class="danger" onclick="clearPaste()">🗑 清空</button>
                <button onclick="handlePaste()">▶ 开始播放</button>
            </div>
        </div>

        <div class="divider">或</div>

        <div class="upload-card" style="padding: 0; background: transparent; border: none;">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="file-label">📁 选择Excel文件</div>
                <div class="hint">支持 .xlsx, .xls 格式<br>自动读取指定列并生成二维码</div>
            </div>
			
			 <!-- 新增的下载链接，放在上传区域下方 -->
        <a href="https://github.com/wuyez/erweima/raw/refs/heads/main/%E4%BA%8C%E7%BB%B4%E7%A0%81%E6%BA%90%E6%96%87%E4%BB%B6%E6%A8%A1%E6%9D%BF.xlsx" 
          >
            📥 导入文件模板下载
        </a>
			
            <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFile(event)">
        </div>

        <div id="fileInfo" style="margin-top: 10px; color: #4a90e2; font-weight: bold; min-height: 24px;"></div>
    </div>

    <!-- 播放界面 -->
    <div class="player-screen" id="playerScreen">
        <div class="qr-container" id="qrContainer">
            <div id="qrWrapper">
                <div id="qrcode"></div>
                <div class="data-info">
                    <div class="data-item">
                        <span class="data-label">C:</span>
                        <span id="colC">-</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">E:</span>
                        <span id="colE">-</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">K:</span>
                        <span id="colK">-</span>
                    </div>
                </div>
                <div class="url-display" id="urlDisplay">等待开始...</div>
            </div>
        </div>

        <div class="keyboard-hint">
            快捷键：空格键 暂停/继续 | ← → 切换 | ESC 退出
        </div>

        <div class="info-bar">
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="progress-info">
                    <span id="currentNum">0</span> / <span id="totalNum">0</span>
                </div>
            </div>

            <div class="controls">
                <div class="speed-control">
                    <span>间隔:</span>
                    <input type="range" id="speedRange" min="1" max="10" value="3" onchange="updateSpeed()">
                    <span id="speedValue">3秒</span>
                </div>

                <button class="secondary" onclick="prevQR()">⏮ 上一个</button>

                <button id="playBtn" onclick="togglePlay()">
                    <span class="status-indicator paused" id="statusIndicator"></span>
                    <span id="playBtnText">开始播放</span>
                </button>

                <button class="secondary" onclick="nextQR()">下一个 ⏭</button>
                <button class="secondary" onclick="resetAll()">退出 ↩</button>
            </div>
        </div>
    </div>

    <script>
        /**********************************************************
         * 配置区：列映射（0起始索引）
         * 第1列=0, 第2列=1, ... 第19列=18
         **********************************************************/
        const CONFIG = {
            filterColumn: 17,     // 第18列（R列）→ 过滤条件列
            filterValue: '设备接入', // 仅当该列等于此值时才生成二维码
            urlColumn: 18,        // 第19列（S列）→ 二维码内容
            infoColumns: {
                C: 2,             // 第3列（C列）
                E: 4,             // 第5列（E列）
                K: 10             // 第11列（K列）
            }
        };

        let data = [];
        let currentIndex = 0;
        let isPlaying = false;
        let timer = null;
        let interval = 3000;
        let isBlue = true;

        // ========== 粘贴文本处理 ==========

        function clearPaste() {
            document.getElementById('pasteInput').value = '';
            document.getElementById('pasteInput').focus();
        }

        function handlePaste() {
            const rawText = document.getElementById('pasteInput').value.trim();
            if (!rawText) {
                alert('请先粘贴数据到文本框中');
                return;
            }

            const lines = rawText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) {
                alert('未检测到有效数据');
                return;
            }

            data = [];

            lines.forEach((line, index) => {
                // 优先按 Tab 分隔，如果没有 Tab 则按逗号分隔
                let cols;
                if (line.includes('\t')) {
                    cols = line.split('\t');
                } else if (line.includes(',')) {
                    cols = line.split(',');
                } else {
                    // 尝试按多个空格分隔（某些复制场景）
                    cols = line.split(/\s{2,}/);
                }

                const url = cols[CONFIG.urlColumn];
                const filterVal = (cols[CONFIG.filterColumn] || '').toString().trim();

                if (url && typeof url === 'string' && url.trim().startsWith('http') && filterVal === CONFIG.filterValue) {
                    data.push({
                        url: url.trim(),
                        colC: cols[CONFIG.infoColumns.C] || '-',
                        colE: cols[CONFIG.infoColumns.E] || '-',
                        colK: cols[CONFIG.infoColumns.K] || '-',
                        row: index + 1
                    });
                }
            });

            if (data.length === 0) {
                alert('未找到符合条件的数据。\n\n请确认：\n1. 数据是否包含19列以上\n2. 第18列（R列）值为"设备接入"\n3. 第19列（S列）为http开头的链接\n4. 分隔符是否为Tab或逗号');
                return;
            }

            startPlayer();
        }

        // ========== Excel文件处理 ==========

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fileInfo').innerHTML = '<span class="loading"></span> 正在读取...';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const raw = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(raw, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1, defval: ''});

                    data = [];
                    jsonData.forEach((row, index) => {
                        const url = row[CONFIG.urlColumn];
                        const filterVal = (row[CONFIG.filterColumn] || '').toString().trim();

                        if (url && typeof url === 'string' && url.trim().startsWith('http') && filterVal === CONFIG.filterValue) {
                            data.push({
                                url: url.trim(),
                                colC: row[CONFIG.infoColumns.C] || '-',
                                colE: row[CONFIG.infoColumns.E] || '-',
                                colK: row[CONFIG.infoColumns.K] || '-',
                                row: index + 1
                            });
                        }
                    });

                    if (data.length === 0) {
                        alert('未找到符合条件的数据。\n\n请确认：\n1. 第18列（R列）值为"设备接入"\n2. 第19列（S列）为http开头的链接');
                        document.getElementById('fileInfo').textContent = '';
                        return;
                    }

                    document.getElementById('fileInfo').innerHTML = 
                        `✅ 成功读取 ${data.length} 条符合条件的数据，即将开始...`;

                    setTimeout(() => {
                        startPlayer();
                    }, 600);

                } catch (err) {
                    alert('读取文件失败：' + err.message);
                    document.getElementById('fileInfo').textContent = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ========== 启动播放（默认暂停） ==========

        function startPlayer() {
            document.getElementById('uploadScreen').style.display = 'none';
            document.getElementById('playerScreen').style.display = 'flex';
            document.getElementById('totalNum').textContent = data.length;
            showQR(0);
            isPlaying = false;
            document.getElementById('playBtnText').textContent = '开始播放';
            document.getElementById('statusIndicator').classList.add('paused');
        }

        // ========== 二维码播放逻辑 ==========

        function showQR(index) {
            if (index < 0 || index >= data.length) return;

            currentIndex = index;
            const item = data[index];

            // 生成二维码
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById("qrcode"), {
                text: item.url,
                width: 400,
                height: 400,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // 更新辅助信息
            document.getElementById('colC').textContent = item.colC;
            document.getElementById('colE').textContent = item.colE;
            document.getElementById('colK').textContent = item.colK;
            document.getElementById('urlDisplay').textContent = item.url;
            document.getElementById('currentNum').textContent = index + 1;

            // 蓝紫双色切换
            const wrapper = document.getElementById('qrWrapper');
            const items = document.querySelectorAll('.data-item');
            if (isBlue) {
                wrapper.style.borderColor = '#9b59b6';
                items.forEach(el => el.style.borderLeftColor = '#9b59b6');
            } else {
                wrapper.style.borderColor = '#4a90e2';
                items.forEach(el => el.style.borderLeftColor = '#4a90e2');
            }
            isBlue = !isBlue;
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btnText = document.getElementById('playBtnText');
            const indicator = document.getElementById('statusIndicator');

            if (isPlaying) {
                btnText.textContent = '暂停播放';
                indicator.classList.remove('paused');
                playNext();
            } else {
                btnText.textContent = '开始播放';
                indicator.classList.add('paused');
                if (timer) clearTimeout(timer);
            }
        }

        function playNext() {
            if (!isPlaying) return;
            if (currentIndex >= data.length - 1) currentIndex = -1;
            showQR(currentIndex + 1);
            timer = setTimeout(() => playNext(), interval);
        }

        function nextQR() {
            if (currentIndex < data.length - 1) {
                showQR(currentIndex + 1);
                if (isPlaying) { clearTimeout(timer); timer = setTimeout(() => playNext(), interval); }
            }
        }

        function prevQR() {
            if (currentIndex > 0) {
                showQR(currentIndex - 1);
                if (isPlaying) { clearTimeout(timer); timer = setTimeout(() => playNext(), interval); }
            }
        }

        function updateSpeed() {
            const val = document.getElementById('speedRange').value;
            interval = val * 1000;
            document.getElementById('speedValue').textContent = val + '秒';
        }

        function resetAll() {
            if (confirm('确定要退出并重新上传文件或粘贴数据吗？')) {
                if (timer) clearTimeout(timer);
                data = [];
                currentIndex = 0;
                isPlaying = false;
                document.getElementById('playerScreen').style.display = 'none';
                document.getElementById('uploadScreen').style.display = 'flex';
                document.getElementById('fileInfo').textContent = '';
                document.getElementById('fileInput').value = '';
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('playerScreen').style.display === 'none') return;
            switch(e.code) {
                case 'Space': e.preventDefault(); togglePlay(); break;
                case 'ArrowLeft': prevQR(); break;
                case 'ArrowRight': nextQR(); break;
                case 'Escape': resetAll(); break;
            }
        });

        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space' && e.target === document.body) e.preventDefault();
        });
    </script>
</body>
</html>
